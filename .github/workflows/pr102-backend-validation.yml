name: PR 102 Backend Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, feat/agentic-tool-calling-multi-agent]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr102-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: pnpm --filter @workspace/functions test

      - name: Typecheck backend
        run: pnpm --filter @workspace/functions typecheck
