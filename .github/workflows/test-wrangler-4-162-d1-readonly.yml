name: Test Wrangler 4.162.0 D1 Read-only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-wrangler-4-162-d1-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badboy-wrangler-4-162-d1-readonly
  cancel-in-progress: false

jobs:
  verify:
    name: Verify D1 with Wrangler 4.162.0 (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify required credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Confirm Wrangler version
        run: pnpm dlx wrangler@4.162.0 --version

      - name: Read production D1 migration status (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.162.0 d1 migrations list badboy-agent-db --remote --config wrangler.json

      - name: Run SELECT 1 against production D1 (read-only)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.162.0 d1 execute badboy-agent-db --remote --config wrangler.json --command "SELECT 1 AS wrangler_read_only_test"

      - name: Inspect D1 migration metadata table (read-only)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.162.0 d1 execute badboy-agent-db --remote --config wrangler.json --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name='d1_migrations'"

      - name: Confirm no migration apply command is configured
        if: always()
        run: echo "Read-only test complete. No d1 migrations apply command was run."
